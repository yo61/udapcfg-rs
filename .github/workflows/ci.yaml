name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          # Pin mise itself, like every tool in mise.toml. Unpinned, the
          # action asks mise's update channel for the latest version and
          # downloads that tag from GitHub releases -- and the two can
          # disagree. On 2026-09-08 the channel advertised 2026.9.3 while
          # the newest published release was 2026.9.2, so every run 404'd.
          # Refresh deliberately, the same as the toolchain.
          version: 2026.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo nextest run --all-features --no-tests=pass
      - name: Supply chain
        run: cargo deny check
