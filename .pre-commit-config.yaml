# Hooks contributors run locally; the CI `lint` job runs the same set with
# `prek run --all-files`. commitlint is a commit-msg hook that `prek run`
# skips, so the `Conventional Commits` job covers it separately.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
  - repo: https://github.com/jdx/jactionlint
    rev: 1027f0a131ab98bc7e191d995bfa15dbed5bbf8f  # frozen: v2.2.0
    hooks:
      - id: jactionlint
  - repo: local
    hooks:
      # Formatting only. clippy is deliberately absent: it takes minutes on
      # this workspace, and the `build` matrix in .github/workflows/ci.yaml
      # runs it with -D warnings on every target -- broader coverage than the
      # ubuntu-only `check` job that used to run it.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
