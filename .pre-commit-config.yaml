# Hooks contributors run locally; the CI `lint` job runs the same set with
# `prek run --all-files`. commitlint is a commit-msg hook that `prek run`
# skips, so the `Conventional Commits` job covers it separately.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Exact: Renovate's regex manager in renovate.json5 moves it; Dependabot moves rev.
        additional_dependencies: ['@commitlint/config-conventional@21.2.3']
  # The maintained fork: upstream rhysd/actionlint stopped at 1.7.12, which rejects the
  # ubuntu-26.04 runner label.
  - repo: https://github.com/kjanat/actionlint
    rev: v1.17.0
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
  - repo: local
    hooks:
      # Formatting only. clippy is deliberately absent: it takes minutes on
      # this workspace, and the `build` matrix in .github/workflows/ci.yaml
      # runs it with -D warnings on every target -- broader coverage than the
      # ubuntu-only `check` job that used to run it.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
